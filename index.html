<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8號展覽廳-日軍侵華.攜手抗敵(問答)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", SimHei, "PingFang TC", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            color: #222;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        header {
            background: #b82601;
            color: white;
            padding: 24px;
            text-align: center;
        }
        header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        header p {
            opacity: 0.9;
            font-size: 16px;
        }
        .intro {
            padding: 24px;
            background: #fff8f8;
            border-bottom: 1px solid #eee;
        }
        .intro h3 {
            color: #b82601;
            margin-bottom: 10px;
        }
        /* 影片模組通用樣式 */
        .video-wrap {
            padding: 24px;
            background: #fef6f6;
            border-bottom: 1px solid #eee;
        }
        .video-wrap h3 {
            color: #b82601;
            margin-bottom: 12px;
        }
        .video-box {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            margin-bottom:16px;
        }
        .video-box video,
        .video-box iframe {
            width: 100%;
            display: block;
            aspect-ratio: 16 / 9;
            border: none;
        }
        .video-desc{
            color:#666;
            font-size:14px;
        }
        .quiz-box {
            padding: 30px;
        }
        .question-num {
            color: #666;
            margin-bottom: 12px;
        }
        .question-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            min-height: 60px;
        }
        .options-list {
            list-style: none;
        }
        .options-list li {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .options-list li:hover {
            border-color: #b82601;
            background: #fff2f2;
        }
        /* 答題標記樣式 */
        .option-correct {
            background: #e6f9e6 !important;
            border-color: #009944 !important;
            color: #007733;
        }
        .option-wrong {
            background: #ffeaea !important;
            border-color: #dd3333 !important;
            color: #bb2222;
        }
        .tip-box {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            display: none;
        }
        .tip-correct {
            background: #e6f9e6;
            border:1px solid #009944;
        }
        .tip-wrong {
            background: #ffeaea;
            border:1px solid #dd3333;
        }
        .btn-group {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 26px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        #nextBtn {
            background: #b82601;
            color: white;
        }
        #nextBtn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        #resetBtn {
            background: #444;
            color: white;
        }
        #resetBtn:hover {
            background: #222;
        }
        #nextBtn:not(:disabled):hover {
            background: #9e1f00;
        }
        .score-panel {
            margin-top: 20px;
            padding: 16px;
            background: #f0f4ff;
            border-radius: 8px;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 14px;
            border-top: 1px solid #eee;
        }
        @media(max-width:600px){
            header h1 {
                font-size: 22px;
            }
            .quiz-box, .video-wrap, .intro {
                padding: 16px;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>8號展覽廳-日軍侵華.攜手抗敵(問答)</h1>
            <p>了解香港發展歷史，學習正確歷史知識（8號館主題）</p>
        </header>

        <div class="intro">
            <h3>📖 網站簡介</h3>
            <p>本問答題庫圍繞8號展廳展品與香港抗戰歷史設置考題，觀看影片後完成測驗，加深對日軍侵華、香港援華通道歷史的認識。</p>
        </div>

        <!-- 中文介紹影片（原有B站影片） -->
        <div class="video-wrap">
            <h3>🎬 8號館 中文介紹影片</h3>
            <div class="video-box">
                <iframe 
                    src="https://player.bilibili.com/player.html?bvid=BV15FgQ6hEtj&autoplay=0&danmaku=0" 
                    frameborder="0" 
                    allowfullscreen
                    allow="encrypted-media">
                </iframe>
            </div>
            <p class="video-desc">建議先觀看中文影片，認識8號館完整展覽脈絡</p>
        </div>

        <!-- 新增英文介紹影片 Google Drive -->
        <div class="video-wrap">
            <h3>🎬 8號館 English Introduction Video</h3>
            <div class="video-box">
                <iframe 
                    src="https://drive.google.com/file/d/1OGSQtzmjMIEBW8cWAuXqb7rfMj6ftjv5/preview" 
                    frameborder="0" 
                    allowfullscreen>
                </iframe>
            </div>
            <p class="video-desc">English version introduction video of Exhibition Hall 8</p>
        </div>

        <div class="quiz-box">
            <div class="question-num" id="qNum">題目 1 / 8</div>
            <div class="question-title" id="question"></div>
            <ul class="options-list" id="options"></ul>
            <div class="tip-box" id="answerTip"></div>

            <div class="btn-group">
                <button id="nextBtn" disabled>下一題</button>
                <button id="resetBtn">重新答題</button>
            </div>

            <div class="score-panel">
                <h4>當前得分：<span id="score">0</span> / <span id="total">8</span></h4>
            </div>
        </div>

        <footer>
            香港歷史知識問答學習平台 · 尊重歷史，銘記發展歷程
        </footer>
    </div>

    <script>
        // 全新8道繁體題目
        const quizData = [
            {
                question: "1. 展廳民間愛國飾品子彈墜飾項鏈的主體原材料是:",
                options: ["A. 炮彈殼","B. 步槍子彈彈頭","C. 手榴彈碎片","D. 飛機殘骸零件"],
                answer: "B",
                explain: ""
            },
            {
                question: "2. 為駐港英軍製作戰前軍帽的本地商鋪是:",
                options: ["A. 恆昌製衣行","B. 利民軍服廠","C. 偉林裁縫及製帽店","D. 大華縫紉工坊"],
                answer: "C",
                explain: ""
            },
            {
                question: "3. 記錄海外援華物資經香港轉運的復刻刊物是:",
                options: ["A. 《香港戰時公報》","B. 1939–1940英文版《保衛中國同盟年報》","C. 《華南抗戰週刊》","D. 《駐港英軍防務日誌》"],
                answer: "B",
                explain: ""
            },
            {
                question: "4. 英軍服務團隱蔽傳遞情報的工具是:",
                options: ["A. 空心鋼筆","B. 中空傳信木螺栓","C. 夾層懷錶","D. 偽裝書本"],
                answer: "B",
                explain: ""
            },
            {
                question: "5. 復刻手繪地圖標註的日軍設施為:",
                options: ["A. 軍用碼頭","B. 步兵營房","C. 高射炮陣地","D. 物資倉庫"],
                answer: "C",
                explain: ""
            },
            {
                question: "6. 1947年表彰西貢鄉民抗日的配套展品是:",
                options: ["A. 錦旗配套原始文字檔案","B. 參戰鄉民的舊軍服","C. 戰時捐款賬本","D. 游擊隊員的刀具"],
                answer: "A",
                explain: ""
            },
            {
                question: "7. 體現香港回歸後海防變化的兩件實物是:",
                options: ["A. 軍艦老照片、航海羅盤","B. 駐港英軍舊徽章、海防炮台模型","C. 1997駐港部隊紀念封、南海艦隊標識木牌","D. 現代救生設備、海軍制服"],
                answer: "C",
                explain: ""
            },
            {
                question: "8. 偉林裁縫店出產的軍帽體現戰前香港的什麼作用:",
                options: ["A. 向外出口民用衣帽賺取資金","B. 本地輕工業供給英軍軍備物資，支撐本地防務","C. 批量製作服飾賑濟內地難民","D. 為民間抗日團體縫製制服"],
                answer: "B",
                explain: ""
            }
        ];

        // 全域變數
        let currentIndex = 0;
        let score = 0;
        let answered = false;

        // DOM元素
        const qNumEl = document.getElementById("qNum");
        const questionEl = document.getElementById("question");
        const optionsEl = document.getElementById("options");
        const tipEl = document.getElementById("answerTip");
        const nextBtn = document.getElementById("nextBtn");
        const resetBtn = document.getElementById("resetBtn");
        const scoreEl = document.getElementById("score");
        const totalEl = document.getElementById("total");

        totalEl.textContent = quizData.length;

        // 渲染題目
        function renderQuiz(){
            answered = false;
            tipEl.style.display = "none";
            nextBtn.disabled = true;
            const item = quizData[currentIndex];
            qNumEl.textContent = `題目 ${currentIndex+1} / ${quizData.length}`;
            questionEl.textContent = item.question;
            optionsEl.innerHTML = "";

            item.options.forEach(opt => {
                const li = document.createElement("li");
                li.textContent = opt;
                li.addEventListener("click", ()=>selectOption(opt, li));
                optionsEl.appendChild(li);
            })
        }

        // 選擇答案邏輯
        function selectOption(selectOpt, liDom){
            if(answered) return;
            answered = true;
            nextBtn.disabled = false;
            const qItem = quizData[currentIndex];
            const selectKey = selectOpt.split(".")[0];

            const allLi = optionsEl.querySelectorAll("li");
            allLi.forEach(li=>{
                const key = li.textContent.split(".")[0];
                if(key === qItem.answer){
                    li.classList.add("option-correct");
                }else if(key === selectKey && key !== qItem.answer){
                    li.classList.add("option-wrong");
                }
                li.style.pointerEvents = "none";
            })

            tipEl.style.display = "block";
            if(selectKey === qItem.answer){
                score++;
                scoreEl.textContent = score;
                tipEl.className = "tip-box tip-correct";
                tipEl.innerHTML = `<strong>回答正確！</strong>`;
            }else{
                tipEl.className = "tip-box tip-wrong";
                tipEl.innerHTML = `<strong>回答錯誤</strong>，正確答案是 ${qItem.answer}`;
            }
        }

        // 下一題
        nextBtn.addEventListener("click", ()=>{
            if(currentIndex < quizData.length - 1){
                currentIndex++;
                renderQuiz();
            }else{
                const fullScore = quizData.length;
                const rate = score / fullScore;
                let msg = rate >= 0.7 ? "展廳歷史知識掌握優秀！" : "建議重新觀看中英文影片複習相關知識點";
                alert(`答題完成！你的總分：${score} / ${fullScore}\n${msg}`);
            }
        })

        // 重置答題
        resetBtn.addEventListener("click", ()=>{
            currentIndex = 0;
            score = 0;
            scoreEl.textContent = 0;
            renderQuiz();
        })

        window.onload = renderQuiz;
    </script>
</body>
</html>
