<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港歷史知識問答</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", SimHei, "PingFang TC", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            color: #222;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        header {
            background: #b82601;
            color: white;
            padding: 24px;
            text-align: center;
        }
        header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        header p {
            opacity: 0.9;
            font-size: 16px;
        }
        .intro {
            padding: 24px;
            background: #fff8f8;
            border-bottom: 1px solid #eee;
        }
        .intro h3 {
            color: #b82601;
            margin-bottom: 10px;
        }

        /* 影片區域樣式 */
        .video-wrap {
            padding: 24px;
            background: #fef6f6;
            border-bottom: 1px solid #eee;
        }
        .video-wrap h3 {
            color: #b82601;
            margin-bottom: 12px;
        }
        .video-box {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        .video-box video,
        .video-box iframe {
            width: 100%;
            display: block;
            aspect-ratio: 16 / 9;
            border: none;
        }

        .quiz-box {
            padding: 30px;
        }
        .question-num {
            color: #666;
            margin-bottom: 12px;
        }
        .question-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            min-height: 60px;
        }
        .options-list {
            list-style: none;
        }
        .options-list li {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .options-list li:hover {
            border-color: #b82601;
            background: #fff2f2;
        }
        /* 答題狀態樣式 */
        .option-correct {
            background: #e6f9e6 !important;
            border-color: #009944 !important;
            color: #007733;
        }
        .option-wrong {
            background: #ffeaea !important;
            border-color: #dd3333 !important;
            color: #bb2222;
        }
        .tip-box {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            display: none;
        }
        .tip-correct {
            background: #e6f9e6;
            border:1px solid #009944;
        }
        .tip-wrong {
            background: #ffeaea;
            border:1px solid #dd3333;
        }
        .btn-group {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 26px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        #nextBtn {
            background: #b82601;
            color: white;
        }
        #nextBtn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        #resetBtn {
            background: #444;
            color: white;
        }
        #resetBtn:hover {
            background: #222;
        }
        #nextBtn:not(:disabled):hover {
            background: #9e1f00;
        }
        .score-panel {
            margin-top: 20px;
            padding: 16px;
            background: #f0f4ff;
            border-radius: 8px;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 14px;
            border-top: 1px solid #eee;
        }
        @media(max-width:600px){
            header h1 {
                font-size: 22px;
            }
            .quiz-box, .video-wrap, .intro {
                padding: 16px;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>香港歷史知識問答</h1>
            <p>了解香港發展歷史，學習正確歷史知識</p>
        </header>

        <div class="intro">
            <h3>📖 網站簡介</h3>
            <p>本問答題庫圍繞香港抗戰相關展廳展品設置考題，學習香港抗戰歷史，銘記港人的抗日鬥爭事蹟。完成答題可查看得分與解析，樹立正確歷史觀。</p>
        </div>

        <!-- 影片模組（已替換新影片BV15FgQ6hEtj） -->
        <div class="video-wrap">
            <h3>🎬 8號館歷史簡單了解</h3>
            <div class="video-box">
                <!-- 方案1：本地影片（離線使用，將mp4檔案放入同目錄修改src即可） -->
                <!-- <video controls preload="auto">
                    <source src="hk-history.mp4" type="video/mp4">
                    您的瀏覽器不支援影片播放
                </video> -->

                <!-- 方案2：B站官方可嵌入播放器，新影片BV15FgQ6hEtj -->
                <iframe 
                    src="https://player.bilibili.com/player.html?bvid=BV15FgQ6hEtj&autoplay=0&danmaku=0" 
                    frameborder="0" 
                    allowfullscreen
                    allow="encrypted-media">
                </iframe>
            </div>
            <p style="margin-top:10px;color:#666;font-size:14px;">建議看完影片再開始答題，加深歷史記憶</p>
        </div>

        <div class="quiz-box">
            <div class="question-num" id="qNum">題目 1 / 10</div>
            <div class="question-title" id="question"></div>
            <ul class="options-list" id="options"></ul>
            <div class="tip-box" id="answerTip"></div>

            <div class="btn-group">
                <button id="nextBtn" disabled>下一題</button>
                <button id="resetBtn">重新答題</button>
            </div>

            <div class="score-panel">
                <h4>當前得分：<span id="score">0</span> / <span id="total">10</span></h4>
            </div>
        </div>

        <footer>
            香港歷史知識問答學習平台 · 尊重歷史，銘記發展歷程
        </footer>
    </div>

    <script>
        // 10道展廳展品題庫（全繁體）
        const quizData = [
            {
                question: "1. 8號展廳的展覽主題為？",
                options: ["A. 日佔時期香港游擊鬥爭","B. 日軍侵華·攜手抗敵","C. 近代香港炮台發展史","D. 香港海上防衛現代化歷程"],
                answer: "B",
                explain: "8號展廳展覽主題為日軍侵華·攜手抗敵，展現抗日戰爭時期香港發揮的重要作用。"
            },
            {
                question: "2. 展廳民間愛國飾品子彈墜飾項鍊的主體原材料是？",
                options: ["A. 炮彈殼","B. 步槍子彈彈頭","C. 手榴彈碎片","D. 飛機殘骸零件"],
                answer: "B",
                explain: "民間愛國飾品子彈墜飾項鍊以步槍子彈彈頭作為主體原材料，是戰時民間極具代表性的愛國紀念品。"
            },
            {
                question: "3. 為駐港英軍製作戰前軍帽的本地商鋪是？",
                options: ["A. 恆昌製衣行","B. 利民軍服廠","C. 偉林裁縫及製帽店","D. 大華縫紉工坊"],
                answer: "C",
                explain: "偉林裁縫及製帽店是戰前為駐港英軍製作軍帽的本地商鋪，見證戰前香港本地軍需相關產業。"
            },
            {
                question: "4. 記錄海外援華物資經香港轉運的復刻刊物是？",
                options: ["A. 《香港戰時公報》","B. 1939–1940英文版《保衛中國同盟年報》","C. 《華南抗戰周刊》","D. 《駐港英軍防務日誌》"],
                answer: "B",
                explain: "1939–1940英文版《保衛中國同盟年報》記錄大量海外援華物資經由香港轉運內地支援抗戰的史實。"
            },
            {
                question: "5. 英軍服務團隱蔽傳遞情報的工具是？",
                options: ["A. 空心鋼筆","B. 中空傳信木螺栓","C. 夾層懷錶","D. 偽裝書本"],
                answer: "B",
                explain: "中空傳信木螺栓是英軍服務團用來隱蔽傳遞情報的專用工具。"
            },
            {
                question: "6. 復刻手繪地圖標註的日軍設施為？",
                options: ["A. 軍用碼頭","B. 步兵營房","C. 高射炮陣地","D. 物資倉庫"],
                answer: "C",
                explain: "展廳復刻手繪地圖上面重點標註的是日軍高射炮陣地。"
            },
            {
                question: "7. 1947年表彰西貢鄉民抗日的配套展品是？",
                options: ["A. 錦旗配套原始文字檔案","B. 參戰鄉民的舊軍服","C. 戰時捐款賬本","D. 游擊隊員的刀具"],
                answer: "A",
                explain: "展品包含錦旗以及配套原始文字檔案，用以1947年表彰西貢鄉民在抗日戰爭中的貢獻。"
            },
            {
                question: "8. 體現香港回歸後海防變化的兩件實物是？",
                options: ["A. 軍艦老照片、航海羅盤","B. 駐港英軍舊徽章、海防炮台模型","C. 1997駐港部隊紀念封、南海艦隊標識木牌","D. 現代救生設備、海軍制服"],
                answer: "C",
                explain: "1997駐港部隊紀念封、南海艦隊標識木牌兩件實物，直觀展現香港回歸之後海防力量的變遷。"
            },
            {
                question: "9. 8號展廳展示歷史的起始年份是？",
                options: ["A. 1929年","B. 1931年","C. 1937年","D. 1941年"],
                answer: "B",
                explain: "8號展廳敘事從1931年九一八事變開啟，梳理日軍侵華直至香港抗戰相關歷史脈絡。"
            },
            {
                question: "10. 偉林裁縫店出產的軍帽體現戰前香港的什麼作用？",
                options: ["A. 向外出口民用衣帽賺取資金","B. 本地輕工業供給英軍軍備物資，支撐本地防務","C. 批量製作服飾賑濟內地難民","D. 為民間抗日團體縫製制服"],
                answer: "B",
                explain: "偉林裁縫及製帽店為駐港英軍生產軍帽，反映戰前香港本地輕工業承擔軍備物資供應、支撐本地防務的角色。"
            }
        ];

        // 全域變數
        let currentIndex = 0;
        let score = 0;
        let answered = false;

        // DOM元素
        const qNumEl = document.getElementById("qNum");
        const questionEl = document.getElementById("question");
        const optionsEl = document.getElementById("options");
        const tipEl = document.getElementById("answerTip");
        const nextBtn = document.getElementById("nextBtn");
        const resetBtn = document.getElementById("resetBtn");
        const scoreEl = document.getElementById("score");
        const totalEl = document.getElementById("total");

        // 初始化總題目數量
        totalEl.textContent = quizData.length;

        // 渲染當前題目
        function renderQuiz(){
            answered = false;
            tipEl.style.display = "none";
            nextBtn.disabled = true;
            const item = quizData[currentIndex];
            qNumEl.textContent = `題目 ${currentIndex+1} / ${quizData.length}`;
            questionEl.textContent = item.question;
            optionsEl.innerHTML = "";

            // 生成選項列表
            item.options.forEach(opt => {
                const li = document.createElement("li");
                li.textContent = opt;
                li.addEventListener("click", ()=>selectOption(opt, li));
                optionsEl.appendChild(li);
            })
        }

        // 選擇答案邏輯
        function selectOption(selectOpt, liDom){
            if(answered) return;
            answered = true;
            nextBtn.disabled = false;
            const qItem = quizData[currentIndex];
            const selectKey = selectOpt.split(".")[0];

            // 遍歷所有選項，標記正確/錯誤
            const allLi = optionsEl.querySelectorAll("li");
            allLi.forEach(li=>{
                const key = li.textContent.split(".")[0];
                if(key === qItem.answer){
                    li.classList.add("option-correct");
                }else if(key === selectKey && key !== qItem.answer){
                    li.classList.add("option-wrong");
                }
                li.style.pointerEvents = "none";
            })

            // 計算得分+展示解析提示
            tipEl.style.display = "block";
            if(selectKey === qItem.answer){
                score++;
                scoreEl.textContent = score;
                tipEl.className = "tip-box tip-correct";
                tipEl.innerHTML = `<strong>回答正確！</strong><br>解析：${qItem.explain}`;
            }else{
                tipEl.className = "tip-box tip-wrong";
                tipEl.innerHTML = `<strong>回答錯誤</strong>，正確答案是 ${qItem.answer}<br>解析：${qItem.explain}`;
            }
        }

        // 下一題點擊事件
        nextBtn.addEventListener("click", ()=>{
            if(currentIndex < quizData.length - 1){
                currentIndex++;
                renderQuiz();
            }else{
                // 全部答完彈窗總結
                const fullScore = quizData.length;
                const rate = score / fullScore;
                let msg = "";
                if(rate >= 0.7){
                    msg = "展廳歷史知識掌握優秀！";
                }else{
                    msg = "建議重新觀看影片複習相關展廳歷史知識點";
                }
                alert(`答題完成！你的總分：${score} / ${fullScore}\n${msg}`);
            }
        })

        // 重置全部答題
        resetBtn.addEventListener("click", ()=>{
            currentIndex = 0;
            score = 0;
            scoreEl.textContent = 0;
            renderQuiz();
        })

        // 頁面載入完成渲染第一題
        window.onload = renderQuiz;
    </script>
</body>
</html>
